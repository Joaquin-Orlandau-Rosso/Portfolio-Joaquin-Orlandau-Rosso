<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)" />
    <title>Esta página no existe – Joaquín Orlandau Rosso</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Página estática y sin JS. Repite a mano los tokens y medidas de src/styles/index.scss
         (colores, contenedor, título del hero, botón primario); el modo oscuro sigue al sistema. */
      :root {
        --bg: #faf7f1;
        --ink: #16130e;
        --muted: #655d52;
        --accent: #a8431f;
        --accent-hover: #86341a;
        --on-accent: #fffaf2;
        --select: rgba(168, 67, 31, 0.2);
        --gutter: clamp(1.25rem, 5vw, 4.5rem);
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14110d;
          --ink: #f1ebe0;
          --muted: #a39a8c;
          --accent: #e07a5c;
          --accent-hover: #eb9379;
          --on-accent: #16130e;
          --select: rgba(224, 122, 92, 0.28);
          color-scheme: dark;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        font-size: clamp(100%, calc(67.9% + 0.357vw), 125%);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
        font-family: 'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 1rem;
        line-height: 1.6;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 2px;
      }

      ::selection {
        background: var(--select);
      }

      .container {
        width: 100%;
        max-width: calc(76rem + var(--gutter) * 2);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }

      header .container {
        display: flex;
        align-items: center;
        height: 4.25rem;
      }

      .name {
        font-size: 1rem;
        font-weight: 650;
        letter-spacing: -0.015em;
        white-space: nowrap;
        transition: color 0.2s ease;
      }

      .name:hover {
        color: var(--accent);
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        /* más aire abajo que arriba: el bloque queda apenas por encima del centro */
        padding-block: 2rem clamp(4.5rem, 12vh, 8.75rem);
      }

      .code {
        margin-bottom: clamp(1rem, 1.8vw, 1.5rem);
        font-size: 0.9375rem;
        color: var(--muted);
      }

      /* Peso, tracking e interlínea del título del hero; el tamaño crece parejo de 2.5 a 6 rem (acá hay una sola columna) */
      h1 {
        font-size: clamp(2.5rem, 1.2rem + 6.4vw, 6rem);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.98;
        text-wrap: balance;
      }

      /* La última palabra y el punto no se separan al cortar la línea */
      .nowrap {
        white-space: nowrap;
      }

      /* El punto final es redondo y terracota, como el del favicon. El "." real queda para lectores de pantalla. */
      .dot {
        display: inline-block;
        position: relative;
        top: 0.012em;
        width: 0.155em;
        height: 0.155em;
        margin-left: 0.045em;
        overflow: hidden;
        border-radius: 50%;
        background: var(--accent);
        color: transparent;
        user-select: none;
      }

      .en {
        margin-top: clamp(0.875rem, 1.5vw, 1.375rem);
        font-size: clamp(1.375rem, 0.95rem + 1.9vw, 2.5rem);
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.15;
        color: var(--muted);
        text-wrap: balance;
      }

      /* Igual que .btn.btn-primary del sitio */
      .btn {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0 0.5rem;
        min-height: 2.875rem;
        margin-top: clamp(2rem, 4vw, 3rem);
        padding: 0.5rem 1.375rem;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1.2;
        color: var(--on-accent);
        background: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 0.5rem;
        transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      }

      .btn:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn span[aria-hidden] {
        opacity: 0.6;
      }

      @media (prefers-reduced-motion: reduce) {
        .name,
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <a class="name" href="/">Joaquín Orlandau Rosso</a>
      </div>
    </header>

    <main>
      <div class="container">
        <p class="code">Error 404</p>
        <h1>Esta página no <span class="nowrap">existe<span class="dot">.</span></span></h1>
        <p class="en" lang="en">This page doesn’t exist.</p>
        <a class="btn" href="/">
          <span>Volver al inicio</span>
          <span aria-hidden="true">·</span>
          <span lang="en">Back to home</span>
        </a>
      </div>
    </main>
  </body>
</html>
