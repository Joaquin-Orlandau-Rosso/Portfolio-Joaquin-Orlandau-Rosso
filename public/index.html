    <meta name="theme-color" content="#FAF7F1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Tema antes del primer pintado: sin esto, quien usa modo oscuro ve un destello claro.
      (function () {
        var guardado = null;
        try {
          guardado = localStorage.getItem('theme');
        } catch (e) {
          // almacenamiento bloqueado: se sigue con la preferencia del sistema
        }
        try {
          var oscuro =
            guardado === 'dark' ||
            (guardado !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14110D');
          }
        } catch (e) {}
      })();
    </script>
